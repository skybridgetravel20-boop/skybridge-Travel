[build]
  publish = "dist"
  command = "npm run build"

# SPA redirect rule: Routes all browser requests to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Protect private admin & CEO pages from search engine indexing
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ceo*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-cache, no-store, must-revalidate"
