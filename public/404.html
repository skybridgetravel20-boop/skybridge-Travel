<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyBridge Travel &amp; Tourism</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and converts the path and query
      // string into a query parameter, then redirects to index.html
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' : '') +
        l.search.slice(1).replace(/&/g, '~and~') +
        l.hash
      );
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0b1b3b;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }
      .loader {
        padding: 32px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
      }
      h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #38bdf8; }
      p { font-size: 14px; color: #94a3b8; margin: 0; }
    </style>
  </head>
  <body>
    <div class="loader">
      <h1>SkyBridge Travel &amp; Tourism</h1>
      <p>Redirecting to requested page...</p>
    </div>
  </body>
</html>
